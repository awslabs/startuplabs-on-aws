[project]
name = "agentic-rag-demo"
version = "0.1.0"
description = "Agentic RAG demo with Strands Agents, Bedrock Knowledge Bases, and AgentCore"
requires-python = ">=3.10"
# Dependencies are declared once in requirements.txt (the single source of truth)
# and read dynamically here to avoid duplication/drift.
dynamic = ["dependencies"]

[tool.setuptools.dynamic]
dependencies = { file = ["requirements.txt"] }

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"
