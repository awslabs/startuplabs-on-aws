name: rekognition_client
description: >-
  Dart wrapper for an Amazon Rekognition backend proxy. Exposes a clean,
  transport-agnostic contract for face and label detection; hides HTTP,
  serialization and retries from consumers.
version: 0.1.0
publish_to: none

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  http: ^1.2.0
  meta: ^1.12.0

dev_dependencies:
  lints: ^4.0.0
  test: ^1.25.0
  mocktail: ^1.0.0
